name: Publicar Intervalo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar ferramentas
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Montar e testar
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          node build.mjs
          node tests/e2e.mjs

      - name: Preparar o site
        run: |
          # Cada publicação troca o nome do cache, então o celular baixa a versão nova sozinho.
          sed -i "s/const CACHE = '[^']*'/const CACHE = 'intervalo-${GITHUB_SHA::7}'/" dist/sw.js
          grep "const CACHE" dist/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
